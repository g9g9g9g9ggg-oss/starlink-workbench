name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, device arch)
        run: |
          set -o pipefail
          xcodebuild -project StarlinkWorkbench.xcodeproj \
            -target StarlinkWorkbench \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build 2>&1 | tee build.log | tail -30

      - name: Package unsigned ipa
        run: |
          APP=$(find build -name "StarlinkWorkbench.app" -type d | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry starlink-unsigned.ipa Payload
          ls -la starlink-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starlink-ipa-unsigned
          path: starlink-unsigned.ipa
          retention-days: 30
